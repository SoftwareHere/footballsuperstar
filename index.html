<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D football 1-on-1s: run routes and play corner against an AI rival, with an AI quarterback." />
    <title>Football Superstar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='14' ry='9' fill='%237a3f1d' transform='rotate(-35 16 16)'/%3E%3Cpath d='M11 20 L21 12' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
    <!--
      Lets the unbuilt source run on a plain static host (e.g. GitHub Pages serving
      the repo as-is). Under Vite (dev and build) "three" comes from node_modules
      and this map is unused. Keep the version in step with package-lock.json.
    -->
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="game" aria-label="Football Superstar game view"></canvas>
    <div id="ui"></div>
    <!-- Relative path so it also works from a sub-path like /footballsuperstar/. -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
